<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Bootstrap</title>
  <link rel="icon" type="image/png" href="imagenes/iconos/tienda-de-comestibles.png" />
  <link rel="stylesheet" href="bootstrap-5.3.7-dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body style="background-color: #f8f9fa;">

  <!-- Inicio navbar -->
  <nav class="navbar fixed-top navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Almirante</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://www.sena.edu.co/es-co/Paginas/default.aspx">Sena</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">Plataformas</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="https://zajuna.sena.edu.co/">Zajuna</a></li>
              <li><a class="dropdown-item" href="https://oferta.senasofiaplus.edu.co/sofia-oferta/">SofiaPlus</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="https://caprendizaje.sena.edu.co/sgva/SGVA_Diseno/pag/login.aspx">SGVA</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar" />
          <button class="btn btn-secondary" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>
  <!-- Fin navbar -->

  <!-- Espaciado para compensar el navbar fijo -->
  <div class="my-5 py-4"></div>

  <!-- Formulario -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Formulario de Ingreso de Datos</h2>
    <form>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required />
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="nombre@ejemplo.com" required />
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contrasena" placeholder="Tu contraseña" required />
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  
  <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
